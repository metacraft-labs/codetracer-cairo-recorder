[package]
name = "codetracer-cairo-recorder"
version = "0.1.0"
edition = "2021"
authors = ["Metacraft Labs Ltd"]
description = "CodeTracer recorder for Cairo/StarkNet programs"
license = "Apache-2.0"

[[bin]]
name = "codetracer-cairo-recorder"
path = "src/main.rs"

[dependencies]
# CodeTracer trace format
codetracer_trace_types = "0.16"
codetracer_trace_writer = "0.17"

# Cairo VM and language crates
cairo-vm = "3.2"
cairo-lang-runner = "2.17.0-rc.4"
cairo-lang-compiler = "2.17.0-rc.4"
cairo-lang-sierra = "2.17.0-rc.4"
cairo-lang-sierra-to-casm = "2.17.0-rc.4"
cairo-lang-filesystem = "2.17.0-rc.4"
cairo-lang-defs = "2.17.0-rc.4"
cairo-lang-diagnostics = "2.17.0-rc.4"
cairo-lang-semantic = "2.17.0-rc.4"
cairo-lang-lowering = "2.17.0-rc.4"
cairo-lang-starknet = "2.17.0-rc.4"
cairo-lang-utils = "2.17.0-rc.4"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
eyre = "0.6"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
