# Cross-Repo Integration Tests
#
# Validates that changes to this recorder do not break the CodeTracer VS Code
# extension's Cairo DAP and GUI tests.
#
# Workspace layout (sibling repos cloned alongside this checkout):
#   $GITHUB_WORKSPACE/../
#     codetracer-cairo-recorder/                      <-- this repo (checked out)
#     codetracer/                    <-- cloned (for ct binary)
#     codetracer-vscode-extension/   <-- cloned (test harness + fixtures)

name: Cross-Repo Integration Tests

on:
  pull_request:
    branches: [main, dev, stable]
  push:
    branches: [main, dev, stable]

  workflow_dispatch:
    inputs:
      codetracer_ref:
        description: 'Git ref for codetracer repo'
        required: false
        default: ''
      vscode_extension_ref:
        description: 'Git ref for codetracer-vscode-extension repo'
        required: false
        default: ''

  repository_dispatch:
    types: [cross-repo-test]

jobs:
  wdio-integration:
    runs-on: [self-hosted, nixos]

    steps:
      - name: Generate CI token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Configure NIX_CONFIG with access-tokens
        # The original top-level ``env: NIX_CONFIG`` block referenced
        # ``steps.app-token.outputs.token`` -- but the ``steps`` context
        # is unavailable at workflow level (the new GitHub Actions
        # validator rejects the file before any job starts).  Set
        # ``NIX_CONFIG`` via ``$GITHUB_ENV`` from a step that runs
        # AFTER ``app-token`` so subsequent ``nix develop`` invocations
        # can still fetch private flake inputs.
        run: |
          {
            echo 'NIX_CONFIG<<NIX_EOF'
            echo "access-tokens = github.com=${{ steps.app-token.outputs.token }}"
            echo 'accept-flake-config = true'
            echo 'NIX_EOF'
          } >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup dev env
        # Installs nix and clones the cross-repo siblings adjacent to this
        # checkout at workspace-lock-pinned revisions. workflow_dispatch /
        # repository_dispatch ref inputs override the locked revision for
        # codetracer + the extension (empty => lock). nix-blockchain-development
        # is cloned bare (no override) for the recorder_exec mcl-blockchain
        # flake override patched in below.
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@main
        with:
          env-flavor: nix
          gh-token: ${{ steps.app-token.outputs.token }}
          siblings: |
            codetracer=${{ github.event.inputs.codetracer_ref || github.event.client_payload.codetracer_ref }}
            codetracer-vscode-extension=${{ github.event.inputs.vscode_extension_ref || github.event.client_payload.vscode_extension_ref }}
            codetracer-trace-format
            codetracer-trace-format-nim
            nix-blockchain-development

      - name: Provide codetracer-trace-format into codetracer/libs (CI override)
        # The codetracer Build step below uses
        # ``--override-input codetracer-trace-format
        # path:./libs/codetracer-trace-format``.  The codetracer
        # checkout doesn't ship that directory, so we copy the
        # sibling (already cloned at the lock-pinned revision by
        # setup-dev-env) into the expected path before nix build.
        run: |
          SRC="$GITHUB_WORKSPACE/../codetracer-trace-format"
          DEST="$GITHUB_WORKSPACE/../codetracer/libs/codetracer-trace-format"
          rm -rf "$DEST"
          cp -a "$SRC" "$DEST"

      - name: Build codetracer
        run: |
          cd "$GITHUB_WORKSPACE/../codetracer"
          # Override BOTH trace-format AND trace-format-nim against the
          # workflow-cloned siblings so the Rust wrapper and the Nim FFI
          # advance together.  Without the -nim override, codetracer's
          # flake.lock pins a stale trace-format-nim (864cb81, Jun 12)
          # that predates the meta.dat capability flag bits 6+7
          # introduced in f290ff0.  The cairo recorder calls
          # ``enable_column_breakpoints_support`` /
          # ``enable_column_motions_support`` which set those bits, but
          # the stale db-backend reader's strict ``KnownFlags`` mask
          # then rejects the trace at meta-parse time with
          # ``meta.dat: unknown flag bits set: 0x00C0``.  The dispatcher
          # falls through to the rr replay-worker path with an empty
          # recreator_exe and ``Command::new("").spawn()`` errors with
          # ``No such file or directory (os error 2)`` -- the symptom
          # the WDIO smoke ``ct/event-load`` request surfaces (cross-
          # repo run 27798227206).  Mirror Solana's fix (a43e8f6).
          OVERRIDE="--override-input codetracer-trace-format path:./libs/codetracer-trace-format \
                    --override-input codetracer-trace-format-nim path:$GITHUB_WORKSPACE/../codetracer-trace-format-nim"
          # Force-skip every non-default substituter so nix fetches
          # the noir source from origin and computes the correct hash
          # itself. cache.nixos.org alone is sufficient for the
          # standard nixpkgs paths in this build.
          SUBST_OVERRIDE="--option accept-flake-config false --option substituters https://cache.nixos.org"
          # The runner's per-user fetcher cache
          # (~/.cache/nix/fetcher-cache-v2.sqlite) holds a stale
          # narinfo for the noir git+https input that contradicts the
          # lockfile.  ``--refresh`` forces nix to re-resolve every
          # flake input from origin even when the local cache has an
          # entry, so the cached narHash gets replaced by what
          # upstream currently serves.
          REFRESH="--refresh"
          nix build $SUBST_OVERRIDE $REFRESH -L ".?submodules=1#codetracer" $OVERRIDE -o result-ct
          nix build $SUBST_OVERRIDE -L ".?submodules=1#db-backend" $OVERRIDE -o result-db
          # Merge both outputs into a single bin directory so the extension
          # can find both ct and db-backend via a single runnablePath.
          mkdir -p combined-bin
          ln -sf "$PWD"/result-ct/bin/* combined-bin/
          ln -sf "$PWD"/result-db/bin/* combined-bin/
          echo "$PWD/combined-bin" >> "$GITHUB_PATH"

      - name: Install extension dependencies
        run: |
          cd "$GITHUB_WORKSPACE/../codetracer-vscode-extension"
          nix develop -c just install

      - name: Compile extension TypeScript
        run: |
          cd "$GITHUB_WORKSPACE/../codetracer-vscode-extension"
          nix develop -c just compile-ts

      - name: Restore Nim-compiled ct_vscode.js
        run: |
          cd "$GITHUB_WORKSPACE/../codetracer-vscode-extension"
          if [ -f media/ct_vscode.js ]; then
            cp media/ct_vscode.js out/ct_vscode.js
          fi

      - name: Patch recorder_exec for local flake override
        run: |
          cd "$GITHUB_WORKSPACE/../codetracer-vscode-extension"
          MCL_PATH="$GITHUB_WORKSPACE/../nix-blockchain-development"
          # Replace recorder_exec to bypass direnv (which can't propagate
          # GitHub auth to the NixOS Nix daemon) and use --override-input
          # to resolve mcl-blockchain from the local clone.
          cat > scripts/recorder-shell-exec.sh << HEREDOC
          #!/usr/bin/env bash
          recorder_exec() {
            local repo_dir="\$1"
            shift
            if [ -f "\$repo_dir/flake.nix" ] && command -v nix >/dev/null 2>&1; then
              nix develop "\$repo_dir" --accept-flake-config \\
                --override-input mcl-blockchain "path:$MCL_PATH" \\
                -c "\$@"
            else
              "\$@"
            fi
          }
          HEREDOC

      - name: Patch runnablePath for CI
        run: |
          CT_BIN="$GITHUB_WORKSPACE/../codetracer/combined-bin/ct"
          SETTINGS="$GITHUB_WORKSPACE/../codetracer-vscode-extension/test/wdio/projects/stylus-test/.vscode/settings.json"
          mkdir -p "$(dirname "$SETTINGS")"
          echo "{\"codetracer.runnablePath\": \"$CT_BIN\"}" > "$SETTINGS"
          echo "Patched runnablePath to: $CT_BIN"

      - name: Fetch Cairo corelib
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          CAIRO_VERSION=$(grep 'cairo-lang-compiler' Cargo.toml \
            | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "Cairo version: $CAIRO_VERSION"
          curl -fsSL \
            "https://github.com/starkware-libs/cairo/archive/refs/tags/v${CAIRO_VERSION}.tar.gz" \
            -o cairo-src.tar.gz
          tar xzf cairo-src.tar.gz "cairo-${CAIRO_VERSION}/corelib"
          mv "cairo-${CAIRO_VERSION}/corelib" corelib
          rm -rf "cairo-${CAIRO_VERSION}" cairo-src.tar.gz
          echo "CAIRO_CORELIB_DIR=$PWD/corelib/src" >> "$GITHUB_ENV"

      - name: Record Cairo trace fixture
        run: |
          cd "$GITHUB_WORKSPACE/../codetracer-vscode-extension"
          FORCE=1 bash scripts/prepare-cairo-fixture.sh

      - name: Run Cairo smoke tests
        run: |
          cd "$GITHUB_WORKSPACE/../codetracer-vscode-extension"
          nix develop -c just _xvfb-run \
            "npx wdio run wdio.conf.ts --spec test/wdio/specs/smoke/cairo.e2e.ts"

      - name: Run Cairo deep tests
        run: |
          cd "$GITHUB_WORKSPACE/../codetracer-vscode-extension"
          nix develop -c just _xvfb-run \
            "npx wdio run wdio.conf.ts --spec test/wdio/specs/deep/cairo-deep.e2e.ts"

      - name: Collect diagnostics on failure
        if: failure()
        run: |
          EXT_DIAG="$GITHUB_WORKSPACE/../codetracer-vscode-extension/test/wdio/diagnostics"
          if [ -d "$EXT_DIAG" ]; then
            mkdir -p "$GITHUB_WORKSPACE/wdio-diagnostics"
            cp -r "$EXT_DIAG"/* "$GITHUB_WORKSPACE/wdio-diagnostics/"
          fi

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wdio-cairo-diagnostics
          path: wdio-diagnostics/
          retention-days: 7
          if-no-files-found: ignore
