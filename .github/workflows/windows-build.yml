name: Windows Build
on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Install capnproto
        shell: pwsh
        run: choco install capnproto -y
      - name: Download Cairo corelib
        shell: bash
        run: |
          # Download the corelib from the Cairo release matching our dependency version
          CAIRO_VERSION="2.17.0-rc.4"
          curl -L "https://github.com/starkware-libs/cairo/archive/refs/tags/v${CAIRO_VERSION}.zip" \
            -o /tmp/cairo.zip
          cd /tmp && unzip -q cairo.zip "cairo-${CAIRO_VERSION}/corelib/*"
          echo "CAIRO_CORELIB_DIR=/tmp/cairo-${CAIRO_VERSION}/corelib/src" >> "$GITHUB_ENV"
      - name: Check
        run: cargo check
      - name: Test
        run: cargo test
