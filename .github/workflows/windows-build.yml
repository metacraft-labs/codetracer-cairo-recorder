name: Windows Build
on:
  push:
    branches: [main, dev, stable]
  pull_request:

jobs:
  windows-check:
    # TODO: migrate to self-hosted Windows runner once provisioned.
    runs-on: windows-latest
    steps:
      - name: Generate CI token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup dev env
        # setup-dev-env clones the listed siblings at the
        # workspace-lock-pinned revisions and installs `dev-exec`, which
        # replays this repo's Windows DIY dev env (env.ps1 → Rust,
        # capnproto, Nim) for each wrapped command. This replaces the
        # open-coded manifest/resolve/clone steps plus the
        # dtolnay/rust-toolchain + choco capnproto/Nim installs.
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@main
        with:
          env-flavor: windows-diy
          gh-token: ${{ steps.app-token.outputs.token }}
          siblings: |
            codetracer-trace-format
            codetracer-trace-format-nim

      - name: Download Cairo corelib
        shell: pwsh
        run: |
          $CAIRO_VERSION = "2.17.0-rc.4"
          $dest = "$env:GITHUB_WORKSPACE\cairo-corelib"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Invoke-WebRequest -Uri "https://github.com/starkware-libs/cairo/archive/refs/tags/v$CAIRO_VERSION.zip" `
            -OutFile "$env:TEMP\cairo.zip"
          Expand-Archive -Path "$env:TEMP\cairo.zip" -DestinationPath "$env:TEMP\cairo-extract" -Force
          Copy-Item -Recurse -Force "$env:TEMP\cairo-extract\cairo-$CAIRO_VERSION\corelib" "$dest\"
          Get-ChildItem "$dest\corelib\src" | Select-Object -First 3
          echo "CAIRO_CORELIB_DIR=$dest\corelib\src" >> $env:GITHUB_ENV
      - name: Check
        run: dev-exec cargo check
      - name: Test
        run: dev-exec cargo test
