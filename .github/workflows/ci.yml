name: CI

# Re-plays the project's deterministic dev env on the runner.
# See:
#   https://github.com/metacraft-labs/metacraft-dev-guidelines/blob/latest/policies/ci-shared-dev-env.md

on:
  push:
    branches: [main, dev, stable]
  pull_request:
    branches: [main, dev, stable]

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone codetracer-trace-format sibling
        run: |
          PINS=".github/sibling-pins"
          TF_REF="main"
          if [ -f "${PINS}" ]; then
            PIN="$(grep '^codetracer-trace-format ' "${PINS}" | cut -d' ' -f2)" || true
            [ -n "${PIN}" ] && TF_REF="${PIN}"
          fi
          rm -rf "${GITHUB_WORKSPACE}/../codetracer-trace-format"
          if ! git clone --depth 1 --branch "${TF_REF}" --single-branch \
            "https://github.com/metacraft-labs/codetracer-trace-format.git" \
            "${GITHUB_WORKSPACE}/../codetracer-trace-format" 2>/dev/null; then
            rm -rf "${GITHUB_WORKSPACE}/../codetracer-trace-format"
            git clone --no-checkout "https://github.com/metacraft-labs/codetracer-trace-format.git" \
              "${GITHUB_WORKSPACE}/../codetracer-trace-format"
            git -C "${GITHUB_WORKSPACE}/../codetracer-trace-format" checkout "${TF_REF}"
          fi

      - name: Clone codetracer-trace-format-nim sibling
        # The branch we land on must carry the CTFS multi-stream writer
        # `registerCall.entryStep` off-by-one fix (see
        # `tests/test_tracer.rs` § Windows snforge tests).  On the
        # `phase3-cairo-windows-fix` branch in *this* repo we pin
        # to the matching `phase3-cairo-windows-fix` branch in the
        # Nim sibling; on other branches we keep tracking `main`.
        run: |
          rm -rf "${GITHUB_WORKSPACE}/../codetracer-trace-format-nim"
          BRANCH="main"
          if [ "${GITHUB_REF_NAME}" = "phase3-cairo-windows-fix" ]; then
            BRANCH="phase3-cairo-windows-fix"
          fi
          git clone --depth 1 --branch "${BRANCH}" \
            "https://github.com/metacraft-labs/codetracer-trace-format-nim.git" \
            "${GITHUB_WORKSPACE}/../codetracer-trace-format-nim"

      - name: Setup dev env
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@main
        with:
          env-flavor: nix
          gh-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Nim trace writer library (sibling artifact)
        # TODO: replace with `direnv exec ../codetracer-trace-format-nim
        # just build-trace-writer-lib` once the sibling repo ships
        # that target -- per cross-repo-builds.md.
        run: |
          dev-exec bash -c '
            set -euo pipefail
            cd "${GITHUB_WORKSPACE}/../codetracer-trace-format-nim"
            nimble install -y stew results
            nim c --app:staticlib --mm:arc --noMain -d:release -p:src \
              -o:libcodetracer_trace_writer.a src/codetracer_trace_writer_ffi.nim
          '
          echo "CODETRACER_NIM_LIB_DIR=${GITHUB_WORKSPACE}/../codetracer-trace-format-nim" >> "$GITHUB_ENV"

      - name: Fetch Cairo corelib
        # tests/test_ctfs_audit.rs invokes the recorder which loads
        # the Cairo corelib from $CAIRO_CORELIB_DIR.  Pull the
        # version pinned in Cargo.toml so the corelib matches the
        # compiler crates.
        # TODO: package this in the flake's dev shell so local dev
        # picks it up via the same path.
        run: |
          set -euo pipefail
          CAIRO_VERSION=$(grep 'cairo-lang-compiler' Cargo.toml \
            | head -1 | sed 's/.*"\(.*\)"/\1/')
          curl -fsSL \
            "https://github.com/starkware-libs/cairo/archive/refs/tags/v${CAIRO_VERSION}.tar.gz" \
            -o cairo-src.tar.gz
          tar xzf cairo-src.tar.gz "cairo-${CAIRO_VERSION}/corelib"
          mv "cairo-${CAIRO_VERSION}/corelib" corelib
          rm -rf "cairo-${CAIRO_VERSION}" cairo-src.tar.gz
          echo "CAIRO_CORELIB_DIR=$PWD/corelib/src" >> "$GITHUB_ENV"

      - name: Lint
        run: dev-exec just lint

      - name: Test
        run: dev-exec just test

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: target/
          retention-days: 7
