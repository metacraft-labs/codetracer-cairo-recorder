name: CI (windows-diy)

# Replays the project's Windows DIY dev env (env.ps1 + scoop/winget
# managed toolchain) through the shared `setup-dev-env` composite
# action's `windows-diy` flavor.  Runs alongside `ci.yml` (Linux
# `nix`) and `ci-reprobuild.yml` (multi-OS reprobuild) so all three
# dev-env paths gate merges — see
# `metacraft-dev-guidelines/policies/ci-shared-dev-env.md` §4
# (Migration story) for the rollout shape.
#
# The Windows DIY path is the developer-facing contract on Windows
# (`. .\env.ps1; just test`), so this workflow exists to catch
# Windows-only regressions that the Linux `nix` job can't surface
# and that the reprobuild path could silently hide under its own
# tool-provisioning code.

on:
  push:
    branches: [main, dev, stable]
  pull_request:
    branches: [main, dev, stable]

jobs:
  windows-diy:
    name: Windows DIY — just build/test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate CI token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout metacraft-manifests (workspace locks)
        uses: actions/checkout@v5
        with:
          repository: metacraft-labs/metacraft-manifests
          ref: latest
          path: _manifests
          token: ${{ steps.app-token.outputs.token }}

      - name: Resolve cross-repo workspace-lock SHA
        shell: bash
        run: |
          case "${{ github.event_name }}" in
            pull_request) CANDS="${{ github.event.pull_request.base.sha }}" ;;
            push) CANDS="${{ github.sha }} ${{ github.event.before }}" ;;
            *) CANDS="${{ github.sha }}" ;;
          esac
          LOCK_SHA=""
          for c in $CANDS; do
            [ -z "$c" ] && continue
            [ "$c" = "0000000000000000000000000000000000000000" ] && continue
            if "${{ github.workspace }}/scripts/resolve-sibling-rev.sh" \
                 --repo codetracer-cairo-recorder --sibling codetracer \
                 --manifest-dir "${{ github.workspace }}/_manifests" \
                 --sha "$c" --no-walk >/dev/null 2>&1; then
              LOCK_SHA="$c"; break
            fi
          done
          if [ -z "$LOCK_SHA" ]; then
            echo "::error::No repo-workspaces workspace lock for codetracer-cairo-recorder (candidates: $CANDS). The commit must be published through the workspace tooling."
            exit 1
          fi
          echo "CT_MANIFEST_DIR=${{ github.workspace }}/_manifests" >> "$GITHUB_ENV"
          echo "CT_LOCK_SHA=$LOCK_SHA" >> "$GITHUB_ENV"
          echo "Resolved cross-repo lock SHA for codetracer-cairo-recorder: $LOCK_SHA"

      # Sibling repos the recorder depends on — same set as the
      # `ci-reprobuild.yml` job so the two paths see an identical
      # workspace shape.
      - name: Clone codetracer-trace-format sibling
        shell: bash
        run: |
          # The resolver returns the workspace-locked SHA (not a branch
          # name), so fetch that exact commit and check it out detached.
          TF_REF="$("${{ github.workspace }}/scripts/resolve-sibling-rev.sh" \
            --repo codetracer-cairo-recorder --sibling codetracer-trace-format \
            --manifest-dir "$CT_MANIFEST_DIR" --sha "$CT_LOCK_SHA" --no-walk)"
          DEST="${GITHUB_WORKSPACE}/../codetracer-trace-format"
          rm -rf "$DEST"
          git clone --no-checkout "https://github.com/metacraft-labs/codetracer-trace-format.git" "$DEST"
          git -C "$DEST" fetch --depth 1 origin "${TF_REF}"
          git -C "$DEST" checkout --detach FETCH_HEAD

      - name: Clone codetracer-trace-format-nim sibling
        shell: bash
        run: |
          rm -rf "${GITHUB_WORKSPACE}/../codetracer-trace-format-nim"
          git clone --depth 1 \
            "https://github.com/metacraft-labs/codetracer-trace-format-nim.git" \
            "${GITHUB_WORKSPACE}/../codetracer-trace-format-nim"

      - name: Clone codetracer sibling (env.ps1 dependency)
        # Cairo's env.ps1 dot-sources `../codetracer/env.ps1` for the
        # shared CodeTracer toolchain (Rust + Nim + MSVC bootstrap).
        # Skip the heavy FPC/LLVM/nargo/dotnet steps the recorder
        # doesn't need — env.ps1 already sets those WINDOWS_DIY_SKIP_*
        # flags before sourcing.
        shell: bash
        run: |
          rm -rf "${GITHUB_WORKSPACE}/../codetracer"
          git clone --depth 1 \
            "https://github.com/metacraft-labs/codetracer.git" \
            "${GITHUB_WORKSPACE}/../codetracer"

      - name: Setup dev env (windows-diy flavor)
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@main
        with:
          env-flavor: windows-diy

      - name: just build
        run: dev-exec just build

      - name: just test
        run: dev-exec just test

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-diy-logs
          path: |
            target/
            test-logs/
          retention-days: 7
          if-no-files-found: ignore
